# Configuration Nginx de Production pour Rate It
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimisation des performances
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Configuration WebSocket / Socket.io
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name rate-it.fr www.rate-it.fr;

        # Validation Certbot / Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Serveur HTTPS Principal
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rate-it.fr www.rate-it.fr;

        # Certificats SSL (Chemins standard Let's Encrypt / Certbot)
        ssl_certificate /etc/letsencrypt/live/rate-it.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rate-it.fr/privkey.pem;

        # Paramètres SSL sécurisés
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # En-têtes de sécurité
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Reverse Proxy pour Socket.io / WebSockets (Backend)
        location /socket.io/ {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Désactive le buffering pour une réactivité instantanée de Socket.io
            proxy_buffering off;

            # Empêche la fermeture de la connexion WebSocket en cas d'inactivité
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Reverse Proxy pour l'application Web Next.js (Frontend)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
